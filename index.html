<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夢見るアプリ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">
    <meta name="apple-mobile-web-app-title" content="夢見るアプリ">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-container">
        <header>
            <img src="icon.png" alt="アプリアイコン" class="header-icon">
            <h1>夢見るアプリ</h1>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label>車両価格 (万円)</label>
                <input type="number" id="price" placeholder="例: 219" step="0.1">
            </div>
            <div class="input-group">
                <label>頭金 (万円)</label>
                <input type="number" id="down-payment" placeholder="例: 60" step="0.1">
            </div>
            <div class="input-group">
                <label>支払回数 (ヶ月)</label>
                <input type="number" id="months" placeholder="例: 60">
            </div>
            <div class="input-group">
                <label>金利 (%)</label>
                <input type="number" id="rate" placeholder="例: 3.5" step="0.1">
            </div>
            <div class="input-group">
                <label>年間のボーナス回数</label>
                <select id="bonus-times">
                    <option value="1">年1回</option>
                    <option value="2" selected>年2回</option>
                </select>
            </div>
            <div class="input-group">
                <label>ボーナス1回支払額 (万円)</label>
                <input type="number" id="bonus-amount" placeholder="例: 15" step="0.1">
            </div>

            <button id="calc-btn" onclick="calculateLoan()">ローンシミュレーション</button>
        </div>

        <div id="result-section" class="hidden">
            <div class="result-box">
                <p class="result-title">月々の支払額</p>
                <p class="result-value"><span id="res-monthly">0</span> <span class="unit">万円</span></p>
            </div>
            <div class="result-box">
                <p class="result-title">増えた分 (利息)</p>
                <p class="result-value"><span id="res-interest">0</span> <span class="unit">万円</span></p>
            </div>
            <p class="joke-text">稼いだ分だけ気合いのローン！</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
